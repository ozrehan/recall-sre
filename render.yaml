# Render blueprint for TraceMind — zero-dependency Python backend.
# One-click deploy also works from the Render dashboard with this file.
services:
  - type: web
    name: recall-sre
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt || true"
    startCommand: "python backend/server.py"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      # Optional: point at Hindsight Cloud for the real memory backend.
      # HINDSIGHT_API_KEY alone is enough — the Cloud URL is the default.
      # - key: HINDSIGHT_API_KEY
      #   sync: false
      # Optional: Groq key for LLM-synthesized recommendation briefings.
      # - key: GROQ_API_KEY
      #   sync: false
